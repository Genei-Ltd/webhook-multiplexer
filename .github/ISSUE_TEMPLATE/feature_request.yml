name: Feature request
description: Propose a focused capability or contract change
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete workflow that is not supported.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include CLI or protocol examples when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: I considered tunnel independence and local security boundaries.
          required: true
